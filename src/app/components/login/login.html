
<div class="relative flex min-h-screen items-center justify-center overflow-hidden bg-[#F7F8FC] px-4 py-10">

  <!-- Decorative background elements -->
  <div class="pointer-events-none absolute -left-32 -top-32 h-96 w-96 rounded-full bg-lime-200/30 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-40 -right-24 h-96 w-96 rounded-full bg-green-100/50 blur-3xl"></div>

  <div class="relative z-10 w-full max-w-md">

    <!-- Branding -->
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-lime-400 shadow-lg shadow-lime-200/60">
        <mat-icon class="!h-7 !w-7 !text-[28px] !leading-7 text-slate-900">
          task_alt
        </mat-icon>
      </div>

      <h1 class="text-3xl font-bold tracking-tight text-slate-900">
        Welcome back
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        Sign in to continue to your workspace
      </p>
    </div>

    <!-- Login card -->
    <div class="rounded-2xl border border-slate-200/80 bg-white p-6 shadow-xl shadow-slate-200/50 sm:p-8">

      <form (ngSubmit)="onSubmit()" class="space-y-5">

        <!-- Username -->
        <div>
          <label for="username" class="mb-2 block text-sm font-semibold text-slate-700">
            Username
          </label>

          <div class="relative">
            <mat-icon class="pointer-events-none absolute left-3 top-1/2 !h-5 !w-5 -translate-y-1/2 !text-xl text-slate-400">
              person_outline
            </mat-icon>

            <select
              id="username"
              [(ngModel)]="selectedUsername"
              name="username"
              required
              class="w-full appearance-none rounded-xl border border-slate-200 bg-slate-50 py-3 pl-11 pr-10 text-sm text-slate-700 outline-none transition focus:border-lime-500 focus:bg-white focus:ring-4 focus:ring-lime-100"
            >
              <option value="" disabled>Select your username</option>
              <option *ngFor="let username of usernames" [value]="username">
                {{ username }}
              </option>
            </select>

            <mat-icon class="pointer-events-none absolute right-3 top-1/2 !h-5 !w-5 -translate-y-1/2 !text-xl text-slate-400">
              expand_more
            </mat-icon>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="mb-2 block text-sm font-semibold text-slate-700">
            Password
          </label>

          <div class="relative">
            <mat-icon class="pointer-events-none absolute left-3 top-1/2 !h-5 !w-5 -translate-y-1/2 !text-xl text-slate-400">
              lock_outline
            </mat-icon>

            <input
              type="password"
              id="password"
              [(ngModel)]="password"
              name="password"
              required
              placeholder="Enter your password"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 py-3 pl-11 pr-4 text-sm text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-lime-500 focus:bg-white focus:ring-4 focus:ring-lime-100"
            />
          </div>
        </div>

        <!-- Remember / Forgot password -->
        <div class="flex items-center justify-between gap-3">
          <label for="remember-me" class="flex cursor-pointer items-center gap-2 text-sm text-slate-600">
            <input
              type="checkbox"
              id="remember-me"
              name="remember-me"
              class="h-4 w-4 rounded border-slate-300 accent-lime-600 focus:ring-lime-500"
            />
            Remember me
          </label>

          <a
            href="#"
            class="text-sm font-semibold text-green-800 transition hover:text-lime-700 hover:underline"
          >
            Forgot password?
          </a>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="flex w-full items-center justify-center gap-2 rounded-xl bg-lime-500 px-4 py-3 text-sm font-bold text-slate-900 shadow-md shadow-lime-200/60 transition duration-200 hover:bg-lime-400 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-lime-200 active:scale-[0.99]"
        >
          Sign in
          <mat-icon class="!h-5 !w-5 !text-xl">arrow_forward</mat-icon>
        </button>

      </form>
    </div>

    <!-- Footer -->
    <p class="mt-7 text-center text-xs text-slate-400">
      © {{ currentYear }} T-Manager. All rights reserved.
    </p>

  </div>
</div>
