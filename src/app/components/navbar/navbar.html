
<header class="h-[88px] px-5 md:px-8 flex items-center justify-between bg-white/90 border-b border-gray-100">

  <!-- Left: Menu + Search -->
  <div class="flex items-center gap-5 flex-1">

    <!-- Mobile Menu -->
    <button
      type="button"
      (click)="toggleMenu()"
      class="lg:hidden size-10 rounded-xl flex items-center justify-center text-slate-600 hover:bg-gray-100 transition"
      aria-label="Toggle navigation"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <!-- Search -->
    <div class="relative w-full max-w-[550px] hidden md:block">

      <mat-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
        search
      </mat-icon>

      <input
        type="text"
        placeholder="Search for anything..."
        class="w-full pl-12 pr-16 py-3 bg-gray-50 border border-gray-100 rounded-full text-sm text-slate-800 placeholder:text-gray-400 outline-none focus:bg-white focus:border-green-400 focus:ring-4 focus:ring-green-50 transition"
      />

      <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-gray-400 bg-white border border-gray-200 rounded-md px-2 py-1">
        ⌘ K
      </span>

    </div>

  </div>


  <!-- Right: Actions -->
  <div class="flex items-center gap-3">

    <!-- Add Task -->
    <button
      type="button"
      matTooltip="Add new task"
      (click)="createTask()"
      class="size-11 rounded-full border border-gray-200 bg-white flex items-center justify-center text-slate-800 hover:bg-lime-50 hover:border-lime-400 hover:text-green-700 hover:ring-4 hover:ring-lime-50 transition"
      aria-label="Add new task"
    >
      <mat-icon>add</mat-icon>
    </button>


    <!-- Notifications -->
    <button
      type="button"
      matTooltip="Notifications"
      class="relative size-11 rounded-full border border-gray-200 bg-white flex items-center justify-center text-slate-500 hover:bg-gray-50 hover:ring-4 hover:ring-gray-100 transition"
      aria-label="Notifications"
    >
      <mat-icon>notifications_none</mat-icon>

      <!-- Notification Indicator -->
      <span class="absolute top-2 right-2 size-2.5 bg-red-500 border-2 border-white rounded-full"></span>
    </button>


    <!-- User Profile -->
    @if (user) {

      <button
        type="button"
        mat-button
        [matMenuTriggerFor]="menu"
        [matTooltip]="user.name"
        class="!min-w-0 !p-0 !rounded-full ml-1"
      >

        <div class="flex items-center gap-2">

          <div class="relative">
            <img
              class="size-11 rounded-full object-cover border-2 border-white shadow-sm hover:ring-2 hover:ring-lime-400 transition"
              [src]="user.pic"
              [alt]="user.name"
            />

            <span class="absolute bottom-0 right-0 size-3 bg-green-500 border-2 border-white rounded-full"></span>
          </div>

        </div>

      </button>


      <!-- Profile Menu -->
      <mat-menu #menu="matMenu" xPosition="before">

        <div class="px-4 py-3 border-b border-gray-100">
          <p class="font-semibold text-slate-900">
            {{ user.name }}
          </p>
          <p class="text-xs text-gray-500">
            {{ user.team ?? 'Team Member' }}
          </p>
        </div>

        <a routerLink="/dashboard/settings" mat-menu-item>
          <mat-icon>settings</mat-icon>
          Settings
        </a>

        <button (click)="logUserOut()" mat-menu-item>
          <mat-icon>logout</mat-icon>
          Logout
        </button>

      </mat-menu>

    }

  </div>

</header>
